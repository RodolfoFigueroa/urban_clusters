[project]
name = "urban-clusters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adjusttext>=1.3.0",
    "contextily>=1.6.2",
    "esda>=2.7.1",
    "geopandas>=1.1.1",
    "hdbscan>=0.8.40",
    "jensen-shannon-centroid>=1.0",
    "matplotlib>=3.10.6",
    "pandas>=2.3.2",
    "pandas-stubs>=2.3.2.250827",
    "photutils>=2.3.0",
    "pip-system-certs>=5.3",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "streamlit>=1.52.2",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "PLR2004"]

[tool.basedpyright]
ignore = ["**/*.ipynb"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]

[project.scripts]
cluster_spatial = "urban_clusters.scripts.cluster:cluster_spatial"

[tool.uv]
package = true

[tool.setuptools]
packages = ["urban_clusters"]
